[project]
name = "ut-scheduler-backend"
version = "0.1.0"
description = "UT Scheduler API"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "tzdata>=2024.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0,<4.1",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "freezegun>=1.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
